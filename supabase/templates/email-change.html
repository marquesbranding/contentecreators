<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirme seu novo e-mail</title>
  </head>
  <body
    style="
      margin: 0;
      background: #f4f4f5;
      color: #18181b;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 600px;
              overflow: hidden;
              border: 1px solid #e4e4e7;
              border-radius: 20px;
              background: #ffffff;
            "
          >
            <tr>
              <td style="background: #c5ff00; padding: 24px 32px">
                <img
                  src="{{ .SiteURL }}/brand/official/contente-creators-black.png"
                  alt="Contente Creators"
                  width="240"
                  height="90"
                  style="
                    display: block;
                    width: 240px;
                    height: 90px;
                    margin: 0;
                    object-fit: cover;
                  "
                />
              </td>
            </tr>
            <tr>
              <td style="padding: 32px">
                <h1 style="margin: 0 0 16px; font-size: 28px; line-height: 1.2">
                  Confirme seu novo e-mail
                </h1>
                <p style="margin: 0 0 24px; color: #52525b; line-height: 1.6">
                  Confirme a alteração para que o novo endereço passe a ser
                  usado na sua conta da Contente Creators.
                </p>
                <a
                  href="{{ .ConfirmationURL }}"
                  style="
                    display: inline-block;
                    border-radius: 12px;
                    background: #18181b;
                    color: #ffffff;
                    font-weight: 700;
                    padding: 14px 22px;
                    text-decoration: none;
                  "
                  >Confirmar novo e-mail</a
                >
                <p
                  style="
                    margin: 24px 0 0;
                    color: #71717a;
                    font-size: 13px;
                    line-height: 1.5;
                  "
                >
                  Se você não solicitou a alteração, não utilize este link e
                  proteja sua conta.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
