name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  APP_ENV: local
  CRON_SECRET: ci-only-placeholder-with-at-least-32-characters
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  PUBLIC_SOCIAL_PROOF_ENABLED: "false"
  SMTP_FROM_EMAIL: no-reply@contentecreators.test
  SMTP_FROM_NAME: Contente Creators CI
  SMTP_HOST: 127.0.0.1
  SMTP_PASSWORD: ci-local-only
  SMTP_PORT: "1025"
  SMTP_SECURE: "false"
  SMTP_USER: ci-local-only
  SUPABASE_SERVICE_ROLE_KEY: service_role_ci_placeholder

jobs:
  static-analysis:
    name: Static analysis (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check:
          - format:check
          - lint
          - type-check
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the pinned npm release
        run: npm install --global npm@11.4.2

      - name: Install locked dependencies
        run: npm ci

      - name: Run ${{ matrix.check }}
        run: npm run ${{ matrix.check }}

  tests:
    name: Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - test:unit
          - test:component
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the pinned npm release
        run: npm install --global npm@11.4.2

      - name: Install locked dependencies
        run: npm ci

      - name: Run ${{ matrix.suite }}
        run: npm run ${{ matrix.suite }}

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the pinned npm release
        run: npm install --global npm@11.4.2

      - name: Install locked dependencies
        run: npm ci

      - name: Reject high-severity runtime vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Reject critical vulnerabilities in the complete dependency tree
        run: npm audit --audit-level=critical

  production-build:
    name: Production build
    needs:
      - dependency-audit
      - static-analysis
      - tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the pinned npm release
        run: npm install --global npm@11.4.2

      - name: Install locked dependencies
        run: npm ci

      - name: Restore the Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx', 'next.config.*') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package-lock.json') }}-

      - name: Build the production application
        run: npm run build

  playwright-smoke:
    name: Playwright and axe smoke
    needs:
      - production-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the pinned npm release
        run: npm install --global npm@11.4.2

      - name: Install locked dependencies
        run: npm ci

      - name: Restore the Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx', 'next.config.*') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package-lock.json') }}-

      - name: Install smoke-test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run deterministic browser and accessibility smoke
        run: >-
          npx playwright test
          e2e/marketing/landing.spec.ts
          e2e/identity/auth.spec.ts
          e2e/accessibility/critical-journeys.spec.ts
          --project=desktop-chromium
          --project=mobile-webkit
          --grep="renders complete public content|renders supported login methods|@a11y"

      - name: Upload Playwright diagnostics after failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
