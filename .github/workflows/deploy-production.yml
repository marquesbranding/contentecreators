name: Deploy production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact SHA currently at the tip of main
        required: true
        type: string
      confirmation:
        description: Type "deploy contente-creators-prd"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate main and quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: main

      - name: Verify explicit production intent and commit
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRMATION" = "deploy contente-creators-prd"
          test "$REQUESTED_SHA" = "$(git rev-parse HEAD)"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use the pinned npm version
        run: npm install --global npm@11.4.2

      - name: Install the locked dependency graph
        run: npm ci

      - name: Reject changed applied migration history
        run: |
          node scripts/check-migration-history.mjs \
            "$(git rev-parse HEAD^)" \
            HEAD

      - name: Run production deployment quality gates
        run: |
          npm run format:check
          npm run lint
          npm run type-check
          npm run test:unit
          npm run test:component

  migrate-build-deploy:
    name: Approve, migrate, build, deploy, and verify
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: contente-creators-prd
      url: ${{ steps.deploy.outputs.deployment_url }}
    env:
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out the approved main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use the pinned npm version
        run: npm install --global npm@11.4.2

      - name: Install the locked dependency graph
        run: npm ci

      - name: Pull the production Vercel project configuration
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --no-install vercel pull \
            --yes \
            --no-color \
            --environment=production \
            --token="$VERCEL_TOKEN"
          npx --no-install vercel env pull .env.deployment \
            --yes \
            --no-color \
            --environment=production \
            --token="$VERCEL_TOKEN"

      - name: Verify isolated production configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_NAME: contente-creators-prd
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_PROJECT_NAME: contente-creators-prd
        run: |
          node --env-file=.env.deployment --import tsx \
            scripts/verify-deployment.ts \
            --phase=pre \
            --target=production

      - name: Link the exact production Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          npx --no-install supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD" \
            --yes

      - name: Dry-run production migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          npx --no-install supabase db push \
            --linked \
            --password "$SUPABASE_DB_PASSWORD" \
            --dry-run \
            --yes

      - name: Build the production Vercel artifact
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --no-install vercel build \
            --prod \
            --no-color \
            --token="$VERCEL_TOKEN"

      - name: Apply immutable production migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          npx --no-install supabase db push \
            --linked \
            --password "$SUPABASE_DB_PASSWORD" \
            --yes
          npx --no-install supabase migration list \
            --linked \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy the prebuilt production artifact
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(
            npx --no-install vercel deploy \
              --prebuilt \
              --prod \
              --archive=tgz \
              --no-color \
              --token="$VERCEL_TOKEN"
          )"
          if [[ ! "$deployment_url" =~ ^https://[a-z0-9-]+\.vercel\.app$ ]]; then
            echo "Vercel did not return a safe deployment URL." >&2
            exit 1
          fi
          printf 'deployment_url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify the production deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_NAME: contente-creators-prd
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_PROJECT_NAME: contente-creators-prd
        run: |
          node --env-file=.env.deployment --import tsx \
            scripts/verify-deployment.ts \
            --phase=post \
            --target=production \
            --base-url="$DEPLOYMENT_URL"
